/*
 * THE FACTORY APP FOR ANDROID — a Trusted Web Activity around /factory.
 *
 * It is not a second app. Every screen, every rule and every update comes
 * from the server; this wrapper only gives the floor a home-screen icon that
 * opens the web app full screen, with Chrome's camera and offline storage
 * behind it. So a deploy reaches every phone without anybody reinstalling,
 * and the APK only has to be released again if THIS file changes.
 *
 * Signed with the MBOS release key (mbos-app/keystore): one team, one key.
 * Its SHA-256 is what /.well-known/assetlinks.json vouches for, which is what
 * lets Android open the site without a browser bar.
 */
plugins {
    id "com.android.application"
}

def siteUrl = System.getenv("FACTORY_SITE") ?: "https://one.mahekindia.com"
def siteHost = new URI(siteUrl).host

android {
    namespace "in.mahek.factory"
    compileSdk 34

    defaultConfig {
        applicationId "in.mahek.factory"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("FACTORY_VERSION_CODE") ?: "1") as int)
        versionName(System.getenv("FACTORY_VERSION_NAME") ?: "1.0.0")
        manifestPlaceholders = [
            siteHost: siteHost,
            launchUrl: siteUrl + "/factory",
        ]
        resValue "string", "asset_statements",
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": { \\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"" + siteUrl + "\\\" } }]"
    }

    signingConfigs {
        release {
            storeFile file("../../mbos-app/keystore/mbos-release.keystore")
            storePassword System.getenv("MBOS_KEYSTORE_STORE_PASSWORD")
            keyAlias System.getenv("MBOS_KEYSTORE_KEY_ALIAS")
            keyPassword System.getenv("MBOS_KEYSTORE_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
