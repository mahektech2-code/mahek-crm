# Build, sign and publish the MBOS handset app.
#
# WHY THIS EXISTS. The APK used to be built on whichever laptop had an Android
# SDK, a JDK the Gradle plugin accepted, and the keystore password — which was
# one laptop, and the day it did not have a working JDK the field team simply
# could not be given a new build. Worse, the API base is BAKED INTO THE BUNDLE
# at build time and is not configurable afterwards, so a build made with the
# wrong environment is not a broken setting, it is a broken binary that has to
# be rebuilt and reinstalled by everybody.
#
# It is `workflow_dispatch` rather than push-triggered on purpose. A release
# that reaches somebody's phone is a decision — Android sideloading has no
# staged rollout and no rollback, so the person pressing the button is the
# release, and it should be a person.
name: MBOS APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "API base baked into the app (no trailing slash). This is NOT configurable after the build."
        required: true
        default: https://one.mahekindia.com
      publish:
        description: "Publish the release: archive it in R2 and put it on the droplet, which is what /downloads serves. Off = build and attach to this run only."
        type: boolean
        default: false

concurrency:
  # Never two release builds at once: they would race for the same object key
  # in R2 and the second to finish would silently win.
  group: mbos-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The API base is checked BEFORE anything is built, because the failure
      # it prevents is silent: a bundle pointed at localhost installs, opens,
      # and fails every sync with a network error that looks like bad signal.
      - name: Refuse a build that would point at nowhere
        run: |
          BASE="${{ inputs.api_base }}"
          case "$BASE" in
            https://*) ;;
            *) echo "::error::api_base must be an https URL. Got '$BASE'. The app cannot be repointed after the build."; exit 1 ;;
          esac
          case "$BASE" in
            */) echo "::error::api_base must not end in a slash — the app appends its own paths."; exit 1 ;;
          esac
          echo "Building against $BASE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mbos-app/package-lock.json

      # 17, specifically. The Android Gradle Plugin does not accept 18, which
      # is what made this un-buildable on a developer machine that happened to
      # have 18 installed — the whole reason this workflow exists.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mbos-app
        run: npm ci

      # `android/` is gitignored and regenerated every time. The signing plugin
      # runs as part of this and re-applies the release signing config to the
      # freshly generated build.gradle — see plugins/withReleaseSigning.js.
      - name: Prebuild the native project
        working-directory: mbos-app
        env:
          EXPO_PUBLIC_API_BASE: ${{ inputs.api_base }}
          MBOS_KEYSTORE_STORE_PASSWORD: ${{ secrets.MBOS_KEYSTORE_STORE_PASSWORD }}
          MBOS_KEYSTORE_KEY_PASSWORD: ${{ secrets.MBOS_KEYSTORE_KEY_PASSWORD }}
          MBOS_KEYSTORE_KEY_ALIAS: ${{ secrets.MBOS_KEYSTORE_KEY_ALIAS }}
        run: |
          if [ -z "$MBOS_KEYSTORE_STORE_PASSWORD" ]; then
            echo "::error::MBOS_KEYSTORE_STORE_PASSWORD is not set. Without the release key this would be signed with a throwaway debug key, and Android would treat the result as a DIFFERENT APP — every salesman would have to uninstall, losing anything not yet synced, before they could update. See mbos-app/keystore/README.md."
            exit 1
          fi
          npx expo prebuild --platform android --no-install

      # THE GRADLE JVM NEEDS MORE METASPACE THAN THE TEMPLATE GIVES IT, and
      # the failure does not look like a memory failure.
      #
      # `android/` is generated by prebuild, so gradle.properties is Expo's
      # default template: `-Xmx2048m -XX:MaxMetaspaceSize=512m`. The module
      # graph has outgrown that. Run 34379845727 hit
      # `OutOfMemoryError: Metaspace` twenty-nine times over twenty-seven
      # minutes and never failed — the daemon thrashed, retried, and was still
      # going when `timeout-minutes: 45` cancelled the job. Every publish step
      # then reported `skipped`, which is the same shape as a build that was
      # never asked to publish. Nothing in the summary said "out of memory".
      #
      # Raising the timeout would have bought a longer thrash. This is the
      # actual fix, and it belongs HERE rather than in `app.json`: the number
      # is a property of the build machine, not of the app, and a developer
      # building on their own laptop should not inherit a runner's ceiling.
      #
      # Appended after prebuild because prebuild WRITES this file. A duplicate
      # key in a Java properties file resolves to the last one, so this wins
      # over the template's line without having to edit it in place.
      #
      # GRADLE_OPTS would not do it: even under `--no-daemon` Gradle forks a
      # single-use daemon, and that JVM takes its arguments from this property.
      - name: Give Gradle enough memory to finish
        working-directory: mbos-app/android
        run: |
          {
            echo ""
            echo "# Appended by .github/workflows/mbos-apk.yml — see the note there."
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m"
          } >> gradle.properties
          echo "Effective memory settings:"
          grep -E "jvmargs" gradle.properties

      - name: Build the release APK
        working-directory: mbos-app/android
        env:
          EXPO_PUBLIC_API_BASE: ${{ inputs.api_base }}
        run: ./gradlew assembleRelease --no-daemon

      # Proof the signature is the committed key and not a debug fallback. A
      # wrong signature builds and installs perfectly on a clean phone; it only
      # fails on the salesman who already has the app, which is the worst place
      # to discover it.
      #
      # `apksigner`, NOT `keytool -printcert -jarfile`. A modern release APK is
      # signed with APK Signature Scheme v2/v3 and carries no JAR signature at
      # all, so keytool finds nothing and the check silently has no subject —
      # which is how a verification step ends up verifying nothing.
      - name: Check it was signed with the release key
        working-directory: mbos-app
        env:
          STORE_PASSWORD: ${{ secrets.MBOS_KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MBOS_KEYSTORE_KEY_ALIAS }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No APK at $APK"; exit 1; }

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found in the Android SDK."; exit 1; }

          # Both sides normalised to lowercase hex with no separators: keytool
          # prints AA:BB:CC uppercase, apksigner prints aabbcc.
          norm() { tr -d ': ' | tr '[:upper:]' '[:lower:]'; }
          # The LAST whitespace-separated token on each line, not a colon split.
          # apksigner prints "Signer #1 certificate SHA-256 digest: <hex>", and
          # splitting that on ':' hands back the label rather than the digest —
          # which then never matches, and the step reports a signing failure
          # that is really a parsing one. The digest is always the last token.
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 -i "certificate SHA-256 digest" | awk '{print $NF}' | norm)
          EXPECTED=$(keytool -list -v -keystore keystore/mbos-release.keystore \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -m1 "SHA256:" | awk '{print $NF}' | norm)

          echo "APK signed by:  ${ACTUAL:-<none>}"
          echo "Keystore holds: ${EXPECTED:-<none>}"

          if [ -z "$ACTUAL" ] || [ -z "$EXPECTED" ]; then
            echo "::error::Could not read one of the certificates, so the signature is unverified. Refusing rather than publishing something nobody checked."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "--- what each tool actually printed ---"
            "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256" || true
            keytool -list -v -keystore keystore/mbos-release.keystore \
              -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
              | grep "SHA256:" || true
            echo "::error::This APK is NOT signed with the committed release key. Android would treat it as a different app: every salesman would have to uninstall — losing anything unsynced — before they could update. Do not publish it."
            exit 1
          fi
          echo "Signature matches the committed release key."
          ls -lh "$APK"

      - name: Name it
        id: name
        working-directory: mbos-app
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=mbos-$VERSION-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      # Always attached to the run, published or not — so a build can be
      # inspected and installed by hand before anybody decides to publish it.
      - uses: actions/upload-artifact@v4
        with:
          name: mbos-apk
          path: mbos-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # R2, where the backups already go. NOT the container image: it is 89 MB
      # and this deployment's registry quota is already what makes deploys fail
      # while CI stays green.
      - name: Publish to R2
        if: ${{ inputs.publish }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_REGION: auto
          BUCKET: ${{ secrets.R2_DOWNLOADS_BUCKET }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ]; then
            echo "::error::R2_DOWNLOADS_BUCKET and the R2 credentials must be set as repository secrets to publish."
            exit 1
          fi
          curl -fsSL https://rclone.org/install.sh | sudo bash
          APK=mbos-app/android/app/build/outputs/apk/release/app-release.apk
          # Both names: the versioned one is the record, `mbos.apk` is the
          # stable link people are given and bookmark.
          rclone copyto "$APK" "R2:${BUCKET}/${{ steps.name.outputs.file }}" --s3-no-check-bucket
          rclone copyto "$APK" "R2:${BUCKET}/mbos.apk" --s3-no-check-bucket
          echo "Published ${{ steps.name.outputs.file }} and mbos.apk"

      # R2 IS THE RECORD; THE DROPLET IS WHAT SERVES.
      #
      # This step is the one that was missing, and its absence is why a green
      # "publish" run left every handset on the previous build. The input said
      # "Upload to R2 so /downloads serves it" — but nothing serves /downloads
      # from R2. Caddy has always read it straight off the droplet's own disk:
      #
      #     handle_path /downloads/* { root * /srv/downloads; file_server }
      #
      # and `deploy/docker-compose.yml` mounts `./downloads` there read-only.
      # R2 in this repo is a BACKUP destination — `deploy/backup.sh` writes to
      # it, `deploy/restore.sh` reads from it, and neither has anything to do
      # with `/downloads`. So the upload above succeeded into a bucket no
      # browser ever asks for, and the workflow reported success.
      #
      # Both halves are kept rather than one replacing the other, because they
      # answer different questions: the bucket keeps every release under its
      # versioned name and outlives any one droplet, and the droplet holds the
      # single stable file people are given a link to. The versioned name never
      # goes to the droplet — 25 GiB of disk should not accumulate a release
      # history nobody reads from there.
      #
      # It copies the ARTIFACT rather than pulling back down from R2, so the
      # droplet needs no R2 credentials of its own and this cannot be broken by
      # whatever the backup token's scope happens to be. Written to a temporary
      # name and moved into place, because `mv` within a filesystem is atomic
      # and `scp` straight onto the live path would serve a half-written 89 MB
      # file to anybody downloading during the upload.
      - name: Serve it from the droplet
        if: ${{ inputs.publish }}
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS and DROPLET_HOST must be set — they are what /downloads is actually served from."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${KEY}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${HOSTS}" > ~/.ssh/known_hosts
          APK=mbos-app/android/app/build/outputs/apk/release/app-release.apk
          # Nothing provisions this directory — not bootstrap.sh, not the
          # deploy job. It exists on the live droplet only because somebody
          # made it by hand for the first release, and docker compose would
          # otherwise create `./downloads` itself, owned by root, which the
          # `deploy` user then cannot write into. Making it here means a
          # rebuilt droplet publishes correctly on the first attempt.
          ssh -o BatchMode=yes "deploy@${HOST}" 'mkdir -p /opt/mahekone/downloads'
          scp -o BatchMode=yes "$APK" "deploy@${HOST}:/opt/mahekone/downloads/.mbos.apk.incoming"
          ssh -o BatchMode=yes "deploy@${HOST}" \
            'mv /opt/mahekone/downloads/.mbos.apk.incoming /opt/mahekone/downloads/mbos.apk && ls -l /opt/mahekone/downloads/mbos.apk'
          echo "Serving from the droplet at /downloads/mbos.apk"

      # Proof, not assumption. A publish that reported success while the field
      # kept the previous build is exactly what happened last time, so the run
      # fails if the bytes now being served are not the bytes just built.
      - name: Check the live download is this build
        if: ${{ inputs.publish }}
        run: |
          APK=mbos-app/android/app/build/outputs/apk/release/app-release.apk
          BUILT=$(sha256sum "$APK" | cut -d' ' -f1)
          LIVE=$(curl -fsSL "${{ inputs.api_base }}/downloads/mbos.apk" | sha256sum | cut -d' ' -f1)
          if [ "$BUILT" != "$LIVE" ]; then
            echo "::error::${{ inputs.api_base }}/downloads/mbos.apk is NOT this build. Built ${BUILT}, serving ${LIVE}."
            exit 1
          fi
          echo "Live download matches this build (${BUILT})."

      - name: Say what happened
        run: |
          {
            echo "### MBOS ${{ steps.name.outputs.version }}"
            echo ""
            echo "- Built against \`${{ inputs.api_base }}\` — baked in, not changeable afterwards."
            echo "- Signed with the committed release key, so this updates in place over an existing install."
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "- Archived in R2 as \`${{ steps.name.outputs.file }}\`, and serving at \`${{ inputs.api_base }}/downloads/mbos.apk\` — verified byte-for-byte against this build."
            else
              echo "- **Not published.** Attached to this run only — download it from the Artifacts section above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
