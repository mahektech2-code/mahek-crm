# Build, sign and publish the Factory app for Android.
#
# A NATIVE app (factory-mobile/, Expo + React Native): its screens are on the
# phone, so a change to them reaches the floor only through a new APK from
# here. The RULES are not on the phone alone — every job goes to
# /api/factory/rpc, where the server checks and posts it to the ERP — so a
# server deploy still changes what is accepted without a release.
#
# Signed with the MBOS release key (mbos-app/keystore/). The first Factory
# APK was a Trusted Web Activity signed with the same key under the same
# package, in.mahek.factory, so this installs over it as an update — which
# is also why every versionCode here is 100 + the run number, above the
# wrapper's. Released by a person (`workflow_dispatch`), like MBOS:
# sideloading has no staged rollout and no rollback.
name: Factory APK

on:
  workflow_dispatch:
    inputs:
      site:
        description: "The MahekOne the app talks to (no trailing slash). Baked into the APK."
        required: true
        default: https://one.mahekindia.com
      version:
        description: "Version name shown on the phone, e.g. 2.0.0"
        required: true
        default: "2.0.0"
      publish:
        description: "Publish: put it on the droplet as /downloads/factory.apk. Off = build and attach to this run only."
        type: boolean
        default: false

concurrency:
  group: factory-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Refuse a site that is not https
        run: |
          case "${{ inputs.site }}" in https://*) ;; *) echo "::error::site must be an https URL"; exit 1 ;; esac
          case "${{ inputs.site }}" in */) echo "::error::site must not end in a slash"; exit 1 ;; esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory-mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies
        working-directory: factory-mobile
        run: npm ci

      # Every release must carry a higher code than the last, or a phone that
      # has the app refuses the update.
      - name: Stamp the version
        working-directory: factory-mobile
        run: |
          node -e "const f='app.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f,'utf8'));j.expo.version='${{ inputs.version }}';j.expo.android.versionCode=100+Number('${{ github.run_number }}');j.expo.extra.site='${{ inputs.site }}';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -p "const e=require('./app.json').expo; e.version+' (code '+e.android.versionCode+') → '+e.extra.site"

      - name: Prebuild the native project
        working-directory: factory-mobile
        env:
          EXPO_PUBLIC_SITE: ${{ inputs.site }}
          MBOS_KEYSTORE_STORE_PASSWORD: ${{ secrets.MBOS_KEYSTORE_STORE_PASSWORD }}
          MBOS_KEYSTORE_KEY_PASSWORD: ${{ secrets.MBOS_KEYSTORE_KEY_PASSWORD }}
          MBOS_KEYSTORE_KEY_ALIAS: ${{ secrets.MBOS_KEYSTORE_KEY_ALIAS }}
        run: |
          if [ -z "$MBOS_KEYSTORE_STORE_PASSWORD" ]; then
            echo "::error::The release key's secrets are not set; a debug-signed APK could never be updated in place."
            exit 1
          fi
          npx expo prebuild --platform android --no-install

      # The MBOS build ran out of heap at Gradle's defaults; same project shape.
      - name: Give Gradle enough memory to finish
        working-directory: factory-mobile/android
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m"
          } >> gradle.properties

      - name: Build the release APK
        working-directory: factory-mobile/android
        env:
          EXPO_PUBLIC_SITE: ${{ inputs.site }}
        run: ./gradlew assembleRelease --no-daemon

      # The same proof MBOS's release makes: the signature is the release key,
      # never a debug fallback.
      - name: Check the signature
        env:
          STORE_PASSWORD: ${{ secrets.MBOS_KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MBOS_KEYSTORE_KEY_ALIAS }}
        run: |
          APK=factory-mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No APK at $APK"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          norm() { tr -d ': ' | tr '[:upper:]' '[:lower:]'; }
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -i "certificate SHA-256 digest" | awk '{print $NF}' | norm)
          EXPECTED=$(keytool -list -v -keystore mbos-app/keystore/mbos-release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -m1 "SHA256:" | awk '{print $NF}' | norm)
          echo "APK signed by:  ${ACTUAL:-<none>}"
          echo "Keystore holds: ${EXPECTED:-<none>}"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::This APK is not signed with the release key. Do not publish it."
            exit 1
          fi
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: factory-apk
          path: factory-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # The droplet is what /downloads serves (Caddy's handle_path). Written to
      # temporary names and moved into place, so nobody downloads half a file.
      - name: Serve it from the droplet
        if: ${{ inputs.publish }}
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS and DROPLET_HOST must be set."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${KEY}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${HOSTS}" > ~/.ssh/known_hosts
          APK=factory-mobile/android/app/build/outputs/apk/release/app-release.apk
          CODE=$((100 + ${{ github.run_number }}))
          printf '{"version":"%s","versionCode":%s,"url":"%s/downloads/factory.apk"}\n' \
            "${{ inputs.version }}" "$CODE" "${{ inputs.site }}" > factory.json
          ssh -o BatchMode=yes "deploy@${HOST}" 'mkdir -p /opt/mahekone/downloads'
          scp -o BatchMode=yes "$APK" "deploy@${HOST}:/opt/mahekone/downloads/.factory.apk.incoming"
          scp -o BatchMode=yes factory.json "deploy@${HOST}:/opt/mahekone/downloads/.factory.json.incoming"
          ssh -o BatchMode=yes "deploy@${HOST}" '
            cd /opt/mahekone/downloads &&
            mv .factory.apk.incoming factory.apk &&
            mv .factory.json.incoming factory.json &&
            ls -l factory.apk factory.json'

      - name: Check the live download is this build
        if: ${{ inputs.publish }}
        run: |
          APK=factory-mobile/android/app/build/outputs/apk/release/app-release.apk
          BUILT=$(sha256sum "$APK" | cut -d' ' -f1)
          LIVE=$(curl -fsSL "${{ inputs.site }}/downloads/factory.apk" | sha256sum | cut -d' ' -f1)
          [ "$BUILT" = "$LIVE" ] || { echo "::error::${{ inputs.site }}/downloads/factory.apk is not this build."; exit 1; }
          echo "Live download matches this build ($BUILT)."

      - name: Say what happened
        run: |
          {
            echo "### Factory app ${{ inputs.version }} (code $((100 + ${{ github.run_number }})))"
            echo ""
            echo "- Native app, talks to \`${{ inputs.site }}\`, signed with the MBOS release key."
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "- Serving at \`${{ inputs.site }}/downloads/factory.apk\` and offered on \`/download?team=erp\`."
            else
              echo "- **Not published.** Download it from this run's artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
