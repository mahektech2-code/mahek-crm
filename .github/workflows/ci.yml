# Every push and every pull request runs what a developer runs before pushing:
# lint, the pure engine tests, a production build, and the six §11 journeys
# against a real Postgres. Nothing here talks to Neon — CI gets its own
# throwaway database, the same way each developer does.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: mahek
          POSTGRES_PASSWORD: mahek
          POSTGRES_DB: mahekone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mahek -d mahekone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mahek:mahek@127.0.0.1:5432/mahekone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The db:* and test:* scripts read .env.local, which is never committed.
      # Writing it here keeps CI running the same commands as a developer
      # rather than a second set that could drift.
      - name: Write .env.local
        run: echo "DATABASE_URL=\"$DATABASE_URL\"" > .env.local

      - run: npm run lint

      # The field app is React Native and lints itself, with its own config and
      # its own rules — the root run ignores it precisely because linting an
      # Expo app with `eslint-config-next` produced 23 errors that were about
      # the wrong framework. Taking it out of that run must not mean nobody
      # checks it, so it gets its own step here.
      #
      # `npm ci` in its own directory: it is a separate package with its own
      # lockfile, not a workspace of the root one.
      - name: Field app lint
        run: |
          cd mbos-app
          npm ci
          npm run lint

      - name: Engine tests
        run: npm run test

      - name: Apply migrations
        run: npm run db:migrate

      # `npm run build` used to run this itself, back when the build had a
      # database beside it. It is a deploy step now — see deploy.yml — so CI
      # has to say it out loud or the journeys run against an empty catalogue.
      - name: Import the catalogue
        run: npm run catalogue:deploy

      - run: npm run build

      - name: Create mahekone_test
        run: npm run test:db

      - name: Journey tests
        run: npm run test:integration

  # THE IMAGE IS BUILT ON EVERY PR, and pushed nowhere.
  #
  # Production is a container now, and a Dockerfile that only ever runs during
  # a deploy is a Dockerfile you find out about while deploying. The two things
  # this catches are the ones that actually break: a `COPY` whose source moved,
  # and a standalone trace that lands `server.js` somewhere other than where
  # the runtime stage expects it — neither of which `next build` on its own
  # would notice.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mahekone:ci
      # Building proves it compiles. This proves the runtime stage can find
      # what it needs to start at all.
      - name: It has a server to run
        run: docker run --rm --entrypoint sh mahekone:ci -c 'test -f server.js && test -d .next/static && test -d public'

  # THE DEPLOYMENT, RUN SOMEWHERE THAT IS NOT PRODUCTION.
  #
  # Five bugs shipped in a row because this path had never executed anywhere
  # else — each failed on its first ever run, on the droplet. Three of them are
  # in scope here and all three would have gone red in this job:
  #
  #   - the image built without DATABASE_URL, so `next build` died collecting
  #     page data for a route that imports src/db (the `image` job caught that
  #     one already, on its first run)
  #   - postgres published no port, so the migration tunnel forwarded to a
  #     closed one and drizzle-kit reported a bare exit 1 that read exactly
  #     like a broken migration
  #   - Caddy was never started, because the deploy asked for `app` and Caddy
  #     depends on the app rather than being depended on by it
  #
  # The staging directory is deliberately the same SHAPE as /opt/mahekone —
  # compose file, Caddyfile, .env and restart.sh sitting flat together — so
  # this exercises the layout the droplet actually has rather than a
  # convenient approximation of it.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: docker/setup-buildx-action@v3
      - name: Build the image this stack will run
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mahekone:ci

      - name: Lay it out the way the droplet is
        run: |
          mkdir -p /tmp/stack
          cp deploy/docker-compose.yml Caddyfile deploy/restart.sh /tmp/stack/
          cat > /tmp/stack/.env <<'ENV'
          IMAGE=mahekone:ci
          POSTGRES_PASSWORD=ci-not-a-secret
          DATABASE_POOL_MAX=5
          ENV
          # `:80` as the site address is what keeps Caddy from asking Let's
          # Encrypt for a certificate — there is no domain here and an ACME
          # challenge would fail, slowly, and then rate-limit us for trying.
          # Everything else about Caddy is exercised: the reverse proxy, the
          # headers, the compose wiring.
          echo 'DOMAIN=:80' >> /tmp/stack/.env

      - name: Bring it up, with the script the droplet uses
        working-directory: /tmp/stack
        run: bash restart.sh

      # The step that would have caught the closed port. It runs migrations the
      # way deploy.yml does — against a published 127.0.0.1:5432 — rather than
      # reaching inside the container, which would prove nothing about how the
      # deploy actually connects.
      - name: Migrate the way the deploy does
        env:
          DATABASE_URL: postgres://mahek:ci-not-a-secret@127.0.0.1:5432/mahekone
        run: npm run deploy:db

      # And the step that would have caught Caddy never starting. Through the
      # proxy on :80, not directly to the app on :3000 — an app that answers on
      # 3000 while nothing serves 80 is exactly the state that shipped.
      - name: Reach the app THROUGH Caddy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/login || true)
            if [ "$code" = "200" ]; then echo "served through Caddy after $((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "never served through Caddy"
          cd /tmp/stack && docker compose ps && docker compose logs --tail=40
          exit 1

      - name: Logs, if any of that failed
        if: failure()
        working-directory: /tmp/stack
        run: docker compose ps && docker compose logs --tail=60

  # `bootstrap.sh` runs once, on a machine that does not exist yet, and cannot
  # be re-run to find out whether it works. `postgresql-client-17` is not in
  # Ubuntu 24.04's repositories — it ships 16 — so `set -e` aborted the whole
  # script before it reached Docker, on a fresh box, with no useful message.
  #
  # The script itself cannot run in a container (it wants systemd and a real
  # firewall), so this checks the one thing that actually broke: whether apt
  # can resolve every package it names. The list is READ OUT OF the script, so
  # adding a package to bootstrap.sh brings it under this check automatically.
  bootstrap-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Can Ubuntu 24.04 resolve what bootstrap.sh installs?
        run: |
          PKGS=$(grep -oP 'apt-get install -y -qq \K.*' deploy/bootstrap.sh | head -1)
          echo "packages: $PKGS"
          docker run --rm ubuntu:24.04 sh -c "
            apt-get update -qq >/dev/null 2>&1
            apt-get install -s $PKGS >/dev/null
          "
          echo "all resolvable on ubuntu:24.04"

  # The link crawler needs something no other check does: a *running* app on a
  # *seeded* database. That is why it is a second job rather than more steps on
  # the first — it costs a duplicate install and build, and buys a signal that
  # says "a link is broken" instead of a red tick shared with the tests.
  links:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: mahek
          POSTGRES_PASSWORD: mahek
          POSTGRES_DB: mahekone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mahek -d mahekone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mahek:mahek@127.0.0.1:5432/mahekone
      BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write .env.local
        run: echo "DATABASE_URL=\"$DATABASE_URL\"" > .env.local

      - name: Apply migrations
        run: npm run db:migrate

      # The crawler signs in as a seeded user, so the demo data is a
      # prerequisite and not a convenience.
      - run: npm run db:seed

      - run: npm run build

      - name: Start the app
        run: npm start &

      - name: Wait for it to answer
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$BASE_URL/login"; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the app never answered on $BASE_URL"
          exit 1

      - run: npm run check:links
