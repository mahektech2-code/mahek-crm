# Every push and every pull request runs what a developer runs before pushing:
# lint, the pure engine tests, a production build, and the six §11 journeys
# against a real Postgres. Nothing here talks to Neon — CI gets its own
# throwaway database, the same way each developer does.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE OLD SINGLE `ci` JOB IS FIVE JOBS NOW, and `ci` at the bottom is the one
  # status that means "all of them".
  #
  # It ran lint, the handset's checks, the engine tests, the build and then
  # ~105 integration files one after another — about 29 of its ~37 minutes was
  # that last step, every other step waiting behind the one before it. The
  # integration files cannot run concurrently AGAINST ONE DATABASE (each suite
  # truncates the same tables), so they are split across jobs instead: each
  # shard is its own runner with its own Postgres service container, and inside
  # it the files still run strictly one after another. Nothing was removed and
  # nothing was reordered within a database.
  #
  # Each job repeats `npm ci` (about twenty seconds, cached) rather than
  # sharing a workspace between jobs, which would be an artifact upload and
  # download for about as much time as it saves.

  lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mahek:mahek@127.0.0.1:5432/mahekone
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The Dockerfile builds and runs on node:24-alpine, so 24 is what
          # production is. Testing on 22 here meant the gate a change passes
          # and the runtime it lands on were different versions — and the
          # deploy's own test job already ran 24, so the disagreement was
          # settled after the merge rather than before it.
          node-version: 24
          cache: npm

      - run: npm ci

      # The db:* and test:* scripts read .env.local, which is never committed.
      # Writing it here keeps CI running the same commands as a developer
      # rather than a second set that could drift.
      - name: Write .env.local
        run: echo "DATABASE_URL=\"$DATABASE_URL\"" > .env.local

      - run: npm run lint

  # The field app is React Native and lints itself, with its own config and its
  # own rules — the root run ignores it precisely because linting an Expo app
  # with `eslint-config-next` produced 23 errors that were about the wrong
  # framework. Taking it out of that run must not mean nobody checks it, so it
  # has its own job.
  #
  # `npm ci` in its own directory: it is a separate package with its own
  # lockfile, not a workspace of the root one. The root `npm ci` is still run
  # first because the Factory app imports the server's pure rules from ../src.
  #
  # AND ITS TYPES AND ITS TESTS, which nothing ran until they were added here:
  # a local tree usually cannot resolve `@maplibre/maplibre-react-native` at
  # all, so `tsc` skips every call into it and a wrong argument reaches an APK
  # — which cannot be recalled — with nothing in between having looked. A fresh
  # `npm ci` is exactly the tree that can check it.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Field app lint
        run: |
          cd mbos-app
          npm ci
          npm run lint

      - name: Field app types
        run: |
          cd mbos-app
          npm run typecheck

      - name: Field app engine tests
        run: |
          cd mbos-app
          npm run test

      # The Factory app is a second React Native package. It imports the
      # server's pure factory rules from ../src, so its types are checked
      # against them on every change to either side.
      - name: Factory app types
        run: |
          cd factory-mobile
          npm ci
          npm run typecheck

      - name: Factory app tests
        run: |
          cd factory-mobile
          npm test

  engine-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mahek:mahek@127.0.0.1:5432/mahekone
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local
        run: echo "DATABASE_URL=\"$DATABASE_URL\"" > .env.local

      - name: Engine tests
        run: npm run test

      # Pure, and no database: it reads the integration runner's file list as
      # text and proves every file is in exactly one shard.
      - name: Integration sharding
        run: node --test scripts/integration-shards.test.mjs

  # `next build` against a migrated, catalogued database, as it always was.
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://mahek:mahek@127.0.0.1:5432/mahekone

    steps:
      - uses: actions/checkout@v7

      # Not a `services:` container: see .github/actions/postgres.
      - uses: ./.github/actions/postgres

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local
        run: echo "DATABASE_URL=\"$DATABASE_URL\"" > .env.local

      - name: Apply migrations
        run: npm run db:migrate

      # `npm run build` used to run this itself, back when the build had a
      # database beside it. It is a deploy step now — see deploy.yml — so CI
      # has to say it out loud.
      - name: Import the catalogue
        run: npm run catalogue:deploy

      - run: npm run build

  # THE SIX §11 JOURNEYS AND EVERYTHING ELSE THAT NEEDS A REAL POSTGRES.
  #
  # One matrix entry is one runner, one Postgres container and one
  # `mahekone_test`. `run-integration.mjs --shard i/N` takes a balanced slice of
  # its file list (see scripts/integration-shards.mjs) and runs it serially, so
  # no two suites ever share a database. They do not need `next build` — they
  # run through tsx — so they do not wait for it.
  #
  # `fail-fast` is off so one red shard does not hide what the others found,
  # which is the same reason the runner itself goes on past a failed file.
  #
  # The shard count is written twice on this job: the matrix and the `/4` in
  # the run line. The sharding test covers any N.
  integration:
    name: integration (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      DATABASE_URL: postgresql://mahek:mahek@127.0.0.1:5432/mahekone

    steps:
      - uses: actions/checkout@v7

      # Not a `services:` container: see .github/actions/postgres.
      - uses: ./.github/actions/postgres

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local
        run: echo "DATABASE_URL=\"$DATABASE_URL\"" > .env.local

      # `test:db` creates and migrates `mahekone_test` itself, from the
      # `postgres` admin database; the suites never read `mahekone`.
      - name: Create mahekone_test
        run: npm run test:db

      # `lint`, `test` and `build` each run this as an npm pre-hook, and the
      # single job these suites used to share ran it before them, so the
      # gitignored `src/docs/_generated/*.json` always existed by now. A shard
      # runs none of those scripts. No suite is known to read the files, and
      # this costs a second, so the assumption is not left to be tested by a
      # red shard.
      - name: Generate the docs index
        run: node scripts/docs-index.mjs

      - name: Journey tests (shard ${{ matrix.shard }}/4)
        run: npm run test:integration -- --shard ${{ matrix.shard }}/4

  # THE ONE STATUS THAT MEANS "THE CI JOB PASSED", under the name it always
  # had. Anything that asks for `ci` — a branch rule, a habit, a script reading
  # check names — gets the same answer as before: green only if every job above
  # was green. `always()` is what makes a failed or cancelled dependency
  # produce a red `ci` rather than a skipped one, and a skipped required check
  # reads as passing in some configurations.
  ci:
    needs: [lint, mobile, engine-tests, build, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part of CI passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" != "success" ]; then
              echo "::error::At least one CI job did not succeed (${RESULTS})."
              exit 1
            fi
          done

  # THE DEPLOYMENT, RUN SOMEWHERE THAT IS NOT PRODUCTION.
  #
  # Five bugs shipped in a row because this path had never executed anywhere
  # else — each failed on its first ever run, on the droplet. Three of them are
  # in scope here and all three would have gone red in this job:
  #
  #   - the image built without DATABASE_URL, so `next build` died collecting
  #     page data for a route that imports src/db (a separate `image` job
  #     caught that one, on its first run)
  #   - postgres published no port, so the migration tunnel forwarded to a
  #     closed one and drizzle-kit reported a bare exit 1 that read exactly
  #     like a broken migration
  #   - Caddy was never started, because the deploy asked for `app` and Caddy
  #     depends on the app rather than being depended on by it
  #
  # The staging directory is deliberately the same SHAPE as /opt/mahekone —
  # compose file, Caddyfile, .env and restart.sh sitting flat together — so
  # this exercises the layout the droplet actually has rather than a
  # convenient approximation of it.
  #
  # THIS IS ALSO WHERE THE PR'S IMAGE IS BUILT, ONCE. There used to be an
  # `image` job beside it that built the same Dockerfile with the same
  # arguments and checked the runtime stage had a server in it — two runners
  # spending four minutes each on one image. Its check is a step here now, and
  # everything it caught this job catches too: an image that does not build
  # cannot be brought up.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: docker/setup-buildx-action@v4
      - id: node
        uses: ./.github/actions/node-image
      - name: Build the image this stack will run
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mahekone:ci
          build-args: |
            NODE_IMAGE=${{ steps.node.outputs.image }}
          # READ main's layer cache, which deploy.yml writes, and write none.
          # A PR's cache is visible only to that PR, so writing one would spend
          # the repository's 10 GB on layers nothing else can read — and
          # evict main's, which every PR can.
          cache-from: type=gha

      # Building proves it compiles. This proves the runtime stage can find
      # what it needs to start at all, and says so in one line rather than as
      # a container that never comes up.
      - name: It has a server to run
        run: docker run --rm --entrypoint sh mahekone:ci -c 'test -f server.js && test -d .next/static && test -d public'

      - name: Lay it out the way the droplet is
        run: |
          mkdir -p /tmp/stack
          cp deploy/docker-compose.yml Caddyfile deploy/restart.sh /tmp/stack/
          cat > /tmp/stack/.env <<'ENV'
          IMAGE=mahekone:ci
          POSTGRES_PASSWORD=ci-not-a-secret
          DATABASE_POOL_MAX=5
          ENV
          # `:80` as the site address is what keeps Caddy from asking Let's
          # Encrypt for a certificate — there is no domain here and an ACME
          # challenge would fail, slowly, and then rate-limit us for trying.
          # Everything else about Caddy is exercised: the reverse proxy, the
          # headers, the compose wiring.
          echo 'DOMAIN=:80' >> /tmp/stack/.env

      # The compose file is the droplet's own, so it names Docker Hub images and
      # stays that way (renaming them there would recreate the live database
      # container on the next deploy). CI pre-pulls the same images and gives
      # them the names compose asks for, so the stack starts without asking a
      # registry for anything.
      - name: Fetch the stack's images
        working-directory: /tmp/stack
        # Each round asks the public mirror and then Docker Hub, and backs off
        # only when both refuse — a refused pull is not a fault in the change
        # under test. It used to try the mirror five times, 10, 20, 40 and 80
        # seconds apart, before Docker Hub once; through October 2026 the
        # mirror refused every pull, so that was 2m30s per image, 5m10s of
        # every run, before Docker Hub served each in seconds.
        run: |
          for img in $(grep -E '^\s+image: [a-z]' docker-compose.yml | awk '{print $2}' | grep -v '\$'); do
            got=""
            for wait in 10 20 40 80 0; do
              if docker pull -q "public.ecr.aws/docker/library/$img"; then
                docker tag "public.ecr.aws/docker/library/$img" "$img"; got=1; break
              fi
              if docker pull -q "$img"; then got=1; break; fi
              [ "$wait" = 0 ] && break
              echo "both registries refused $img; trying again in ${wait}s"; sleep "$wait"
            done
            [ -n "$got" ] || { echo "::error::$img could not be pulled from any registry"; exit 1; }
          done
          docker images

      - name: Bring it up, with the script the droplet uses
        working-directory: /tmp/stack
        run: bash restart.sh

      # The step that would have caught the closed port. It runs migrations the
      # way deploy.yml does — against a published 127.0.0.1:5432 — rather than
      # reaching inside the container, which would prove nothing about how the
      # deploy actually connects.
      - name: Migrate the way the deploy does
        env:
          DATABASE_URL: postgres://mahek:ci-not-a-secret@127.0.0.1:5432/mahekone
        run: npm run deploy:db

      # And the step that would have caught Caddy never starting. Through the
      # proxy on :80, not directly to the app on :3000 — an app that answers on
      # 3000 while nothing serves 80 is exactly the state that shipped.
      - name: Reach the app THROUGH Caddy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/login || true)
            if [ "$code" = "200" ]; then echo "served through Caddy after $((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "never served through Caddy"
          cd /tmp/stack && docker compose ps && docker compose logs --tail=40
          exit 1

      - name: Logs, if any of that failed
        if: failure()
        working-directory: /tmp/stack
        run: docker compose ps && docker compose logs --tail=60

  # `bootstrap.sh` runs once, on a machine that does not exist yet, and cannot
  # be re-run to find out whether it works. `postgresql-client-17` is not in
  # Ubuntu 24.04's repositories — it ships 16 — so `set -e` aborted the whole
  # script before it reached Docker, on a fresh box, with no useful message.
  #
  # The script itself cannot run in a container (it wants systemd and a real
  # firewall), so this checks the one thing that actually broke: whether apt
  # can resolve every package it names. The list is READ OUT OF the script, so
  # adding a package to bootstrap.sh brings it under this check automatically.
  bootstrap-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Can Ubuntu 24.04 resolve what bootstrap.sh installs?
        run: |
          PKGS=$(grep -oP 'apt-get install -y -qq \K.*' deploy/bootstrap.sh | head -1)
          echo "packages: $PKGS"
          # Pulled first, with retries: the mirror's "toomanyrequests" is a
          # refused download, not an answer about these packages. Each round
          # asks the mirror and then Docker Hub, and backs off only when both
          # refuse.
          img=""
          for wait in 10 20 40 80 0; do
            for candidate in public.ecr.aws/docker/library/ubuntu:24.04 docker.io/library/ubuntu:24.04; do
              if docker pull -q "$candidate"; then img="$candidate"; break 2; fi
            done
            [ "$wait" = 0 ] && break
            echo "both registries refused ubuntu:24.04; trying again in ${wait}s"; sleep "$wait"
          done
          [ -n "$img" ] || { echo "::error::ubuntu:24.04 could not be pulled from any registry"; exit 1; }
          docker run --rm "$img" sh -c "
            apt-get update -qq >/dev/null 2>&1
            apt-get install -s $PKGS >/dev/null
          "
          echo "all resolvable on ubuntu:24.04"

  # The link crawler needs something no other check does: a *running* app on a
  # *seeded* database. That is why it is a second job rather than more steps on
  # the first — it costs a duplicate install and build, and buys a signal that
  # says "a link is broken" instead of a red tick shared with the tests.
  links:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://mahek:mahek@127.0.0.1:5432/mahekone
      BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v7

      # Not a `services:` container: see .github/actions/postgres.
      - uses: ./.github/actions/postgres

      - uses: actions/setup-node@v7
        with:
          # The Dockerfile builds and runs on node:24-alpine, so 24 is what
          # production is. Testing on 22 here meant the gate a change passes
          # and the runtime it lands on were different versions — and the
          # deploy's own test job already ran 24, so the disagreement was
          # settled after the merge rather than before it.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local
        run: echo "DATABASE_URL=\"$DATABASE_URL\"" > .env.local

      - name: Apply migrations
        run: npm run db:migrate

      # The crawler signs in as a seeded user, so the demo data is a
      # prerequisite and not a convenience.
      - run: npm run db:seed

      - run: npm run build

      - name: Start the app
        run: npm start &

      - name: Wait for it to answer
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$BASE_URL/login"; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the app never answered on $BASE_URL"
          exit 1

      - run: npm run check:links
