# Push to main, and about three minutes later it is live.
#
# The build runs HERE, on GitHub's runners, and never on the droplet: `next
# build` runs tsc over the whole codebase and wants more memory than a 1 GiB
# box has spare. The droplet only pulls a finished image.
#
# Migrations are the interesting part. Postgres publishes no port and the
# firewall allows 22, 80 and 443 — so there is no route from here to the
# database, by design. Rather than open one, the migration step forwards a
# local port down the SSH connection: the database stays unreachable from the
# internet and drizzle-kit still runs with the exact toolchain the repo pins.

name: Deploy

on:
  push:
    branches: [main]
  # Deploying the current main by hand — after a rollback, or when a deploy
  # failed on something transient.
  workflow_dispatch:

concurrency:
  # Two deploys overlapping means two `docker compose up` runs and possibly two
  # migrations racing. The later push wins; the earlier one is cancelled.
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com
  IMAGE_NAME: mahekone/app
  APP_DIR: /opt/mahekone

jobs:
  # The same checks that guard a PR. A green build is not evidence the rules
  # still hold, and this deploys straight to the app the accounts team uses.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    env:
      # Read by the `if:` on the collection wait below — a secret cannot be
      # tested in an `if` directly, so it is lifted here once, the same way the
      # prune job lifts it. Without the token the wait is skipped and the push
      # simply takes its chances, which is what it did before this existed.
      HAVE_GC_TOKEN: ${{ secrets.DO_API_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag from the commit
        id: tag
        # The sha, not `latest`. Rolling back means naming the tag you want,
        # and `latest` cannot be named.
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # WAIT FOR A COLLECTION THAT IS ALREADY RUNNING, and only for that.
      #
      # A garbage collection puts the registry READ-ONLY, and a push that lands
      # inside one fails `401 Unauthorized` on the token fetch — which reads as
      # a bad credential and is nothing of the kind. It happened the first time
      # a deploy followed a prune closely: the prune at 21:14 started a
      # collection, the push at 21:27 landed inside it, and two retries failed
      # identically before a third, once the window had passed, succeeded with
      # no change at all.
      #
      # The old code waited 15m30s after STARTING a collection, which was
      # rightly removed — it spent a quarter of an hour of every deploy
      # watching somebody else's clock, all of it after production was already
      # serving. But it did protect this, by accident: holding the workflow's
      # concurrency slot kept the NEXT deploy out of the window. Removing it
      # removed the accident with the waste.
      #
      # So the wait moves to where the risk actually is and becomes
      # conditional. Nothing is running on the ordinary deploy, this answers in
      # one API call and moves on; only a deploy that genuinely collides with a
      # collection pays anything, and it pays it instead of failing.
      - name: Install doctl
        if: env.HAVE_GC_TOKEN == 'yes'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Wait for any registry garbage collection
        if: env.HAVE_GC_TOKEN == 'yes'
        run: |
          set -euo pipefail
          # Bounded. A collection of this registry takes about 25 seconds; ten
          # minutes is far past any honest run, and timing out must not fail
          # the deploy — the push is still worth attempting, and its own error
          # is a better report than one invented here.
          deadline=$(( SECONDS + 600 ))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            # `get-active` exits non-zero when there is none, which is the
            # ordinary case and not an error.
            if ! doctl registry garbage-collection get-active -o json > /tmp/gc.json 2>/dev/null; then
              echo "No collection running."
              exit 0
            fi
            if [ ! -s /tmp/gc.json ] || ! grep -q '"uuid"' /tmp/gc.json; then
              echo "No collection running."
              exit 0
            fi
            echo "A garbage collection is running; the registry is read-only. Waiting 20s."
            sleep 20
          done
          echo "::warning title=Still collecting::A garbage collection was still running after 10 minutes. Pushing anyway; if this fails with 401 it is the collection, not the credential."

      # A registry-scoped credential, not the account API token. The account
      # token would work — DigitalOcean accepts it as both username and
      # password — but it opens every resource on the account, and rotating it
      # for any unrelated reason would silently break deploys.
      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Baked in as Next's deploymentId (next.config.ts) — the same sha
          # the image is tagged with, so a tab open across a deploy reloads
          # itself instead of hitting a stale Server Action.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # GITHUB'S CACHE, NOT THE REGISTRY'S.
          #
          # This was `type=registry,mode=max`, which stores every layer of
          # every build as a `buildcache` tag. It reached 480 MB against the
          # free tier's 500 MB total, and then the next push failed with
          # `denied: quota exceeded` — a deploy broken not by the code but by
          # the cache that existed to make deploys faster.
          #
          # The registry's 500 MB is for IMAGES, and a handful of ~130 MB
          # images is what it comfortably holds. GitHub gives 10 GB of Actions
          # cache free, it is scoped to this repository, and it evicts itself.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NO ATTESTATION, so what is pushed is one image rather than a list.
          #
          # buildx attaches a provenance attestation by default, which turns a
          # plain manifest into a manifest LIST carrying a second, attestation
          # manifest beside the real one — so every tag costs two manifest
          # pushes instead of one, and the registry stores both. Against a
          # 500 MB free tier that has now filled twice, and a push that is
          # already the slowest half of this job, an SBOM nothing in this
          # deployment reads is not worth either.
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # A rerun of an OLD failed run — the registry auth flaking, a stuck
      # garbage collection, anything transient — builds and can still push the
      # commit it was always going to push. Nothing stops it finishing AFTER a
      # newer commit's own run has already deployed, and the swap below has no
      # memory of what it last put in place: it would gladly overwrite a newer
      # production with an older one, silently, the moment this run reaches
      # it. `concurrency` above only cancels runs that overlap — it does
      # nothing for two runs that are never in progress at the same time.
      #
      # So the run checks, right before it would touch anything, whether main
      # has moved past the commit it built. If it has, a newer run either
      # already deployed it or is doing so now, and this one has nothing left
      # to contribute — it stops here rather than putting main's PAST back in
      # front of main's PRESENT.
      - name: Refuse to deploy a commit main has moved past
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "${latest}" != "${GITHUB_SHA}" ]; then
            echo "::warning::main is now at ${latest:0:12}; this run built ${GITHUB_SHA:0:12} and deploying it would put an OLDER commit back in production. A newer run has already handled it — skipping."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.freshness.outputs.current == 'true'
      - uses: actions/setup-node@v7
        if: steps.freshness.outputs.current == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.freshness.outputs.current == 'true'

      - name: Set up the SSH key
        if: steps.freshness.outputs.current == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned, not trust-on-first-use: TOFU in CI means the first
          # connection accepts whatever answers, which is the one thing a host
          # key is for.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # ----------------------------------------------------------- migrations
      #
      # Before the new image serves anything. Every migration in this repo is
      # additive — new columns, new tables, backfills that match on
      # `updated_by_id is null` — so the running OLD code tolerates the new
      # schema for the seconds between this step and the swap below. A
      # destructive migration would need the reverse order and a release that
      # stops writing to the column first.
      - name: Migrate, through the tunnel
        if: steps.freshness.outputs.current == 'true'
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ssh -f -N -L 5433:127.0.0.1:5432 \
            -o ExitOnForwardFailure=yes \
            deploy@${{ secrets.DROPLET_HOST }}
          export DATABASE_URL="postgres://mahek:${PGPASSWORD}@127.0.0.1:5433/mahekone"
          npm run deploy:db

      # ---------------------------------------------------------------- swap
      - name: Pull and restart
        if: steps.freshness.outputs.current == 'true'
        run: |
          ssh deploy@${{ secrets.DROPLET_HOST }} bash -euo pipefail <<'EOF'
            cd ${{ env.APP_DIR }}
            # The tag goes in .env so a reboot brings back the image that was
            # actually deployed, rather than whatever `latest` points at today.
            sed -i 's|^IMAGE=.*|IMAGE=${{ needs.build.outputs.image }}|' .env
            docker compose pull app
            # The same script CI runs against the same compose file. When this
            # was a bare `docker compose up -d app` written out here, it was a
            # second copy of a decision — and it drifted from the one CI would
            # have tested, which is how Caddy came to never be started.
            bash restart.sh
            docker image prune -f --filter 'until=168h'
          EOF

      # An exit code from `docker compose up` says the container started, not
      # that the app works. This asks the running app.
      - name: Check it is actually serving
        if: steps.freshness.outputs.current == 'true'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.DOMAIN }}/login" || true)
            if [ "$code" = "200" ]; then echo "serving after $((i * 10))s"; exit 0; fi
            sleep 10
          done
          echo "Never returned 200 — check: ssh deploy@host 'cd /opt/mahekone && docker compose logs --tail=100 app'"
          exit 1

  # MAKE ROOM, so the NEXT push does not fail — after this one lands, not
  # before it.
  #
  # The free tier is 500 MB and each image is around 130 MB, so the registry
  # is full after three or four deploys and the next push dies with `denied:
  # quota exceeded` — a deploy broken by storage rather than by code, with a
  # green test job above it and the `deploy` job skipped silently underneath.
  #
  # This is the SECOND time that ceiling has been hit. The first was the build
  # cache, which lived in the registry as `buildcache` tags and reached 480 MB
  # on its own; that moved to GitHub's cache and the comment on `cache-to`
  # explains it. The images themselves were left, and nothing has ever removed
  # one. DEPLOY.md said old tags "stay in the registry for a week", which read
  # as a policy and was only ever a description of what nobody had deleted.
  #
  # Deleting a tag does not reclaim anything on DigitalOcean — the blobs stay
  # until a garbage collection runs — so the GC is the step that actually
  # frees the space, and it USED to be waited on before `build`, on the
  # reasoning that a push into a full registry is the failure this exists to
  # prevent.
  #
  # That reasoning was backwards, and it took three separate incidents in one
  # day to see why: DigitalOcean will not even BEGIN deleting anything until
  # every outstanding write-scoped JWT — the credential a push authenticates
  # with — has expired, and that wait routinely outlasts the five minutes this
  # job was ever willing to sit still for. Starting a fresh collection right
  # before the push that this exact job is about to make is asking DigitalOcean
  # to hold the door shut in front of the person walking through it — the
  # `401 Unauthorized` that looked like a flaky credential, three times, was
  # this collection's own JWT wait still open when `build` tried to push. There
  # is no version of "wait longer" that fixes an ordering problem: run after a
  # deploy that already succeeded, with nothing left waiting on it, and the
  # collection can take as long as DigitalOcean wants.
  prune:
    needs: deploy
    runs-on: ubuntu-latest
    # HOUSEKEEPING MUST NOT BE ABLE TO MARK A DEPLOY RED.
    #
    # Nothing needs this job any more — it runs after `deploy` has already
    # succeeded, purely to make room for next time — but a run is read by its
    # colour, and failed housekeeping is not a failed deploy. This is also the
    # job's own history: it once failed for a reason as small as a bad
    # download URL, and at the time that took `build` and `deploy` down with
    # it. The rule was already written for the missing-secret case below ("a
    # warning, never a failed deploy") and simply had not been applied to the
    # job as a whole.
    continue-on-error: true
    env:
      # Read by the `if:` on the steps below — a secret cannot be tested in an
      # `if` directly, so it is lifted here once.
      HAVE_TOKEN: ${{ secrets.DO_API_TOKEN != '' && 'yes' || 'no' }}
    steps:
      # A missing secret is a WARNING, never a failed deploy. Somebody who has
      # not added it yet should still be able to ship; they will hit the quota
      # eventually and this line is what tells them why.
      - name: Say so if the registry cannot be pruned
        if: env.HAVE_TOKEN != 'yes'
        run: |
          echo "::warning title=Registry not pruned::DO_API_TOKEN is not set, so old images were left in place. The free tier holds three or four of them and then pushes fail with 'denied: quota exceeded'. See DEPLOY.md."

      # `DOCR_TOKEN` cannot do this. It is a registry-scoped credential, which
      # is right for pushing and deliberate — see the note on the login step —
      # but the registry API cannot list or garbage-collect, and `doctl` wants
      # an account token. So this takes its own secret, and does NOT fall back
      # to the pushing credential.
      - name: What production is running
        id: live
        if: env.HAVE_TOKEN == 'yes'
        continue-on-error: true
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          set -euo pipefail
          # NEVER DELETE THE IMAGE THE DROPLET IS ON.
          #
          # "Keep the newest N" is not that rule. After a run of failed deploys
          # — which is exactly when this job matters — the tag production is
          # serving is older than the newest N, and pruning takes away the only
          # thing `docker compose up` could pull if the box restarted. It very
          # nearly happened by hand: prod sat on the 3rd newest tag with KEEP=3.
          mkdir -p ~/.ssh
          echo "${KEY}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${HOSTS}" > ~/.ssh/known_hosts
          image="$(ssh -o BatchMode=yes deploy@"${HOST}" 'grep "^IMAGE=" /opt/mahekone/.env' | head -1)"
          echo "live=${image##*:}" >> "$GITHUB_OUTPUT"
          echo "Production is on ${image##*:}"

      # `doctl` is installed by DigitalOcean's own action rather than a URL
      # assembled here. The URL this used to build —
      # `/releases/latest/download/doctl-linux-amd64.tar.gz` — does not exist:
      # doctl's assets carry the version in the filename, so GitHub answered
      # with a 404 HTML page and `tar` said `not in gzip format`. A download
      # that 404s into a decompressor is a class of mistake worth not owning.
      - name: Install doctl
        if: env.HAVE_TOKEN == 'yes'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Prune old images from the registry
        if: env.HAVE_TOKEN == 'yes'
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          LIVE: ${{ steps.live.outputs.live }}
          # Enough to roll back to and few enough to fit: ~130 MB each against
          # 500 MB. `latest` shares its blobs with the newest tag, so it is free.
          KEEP: "3"
        run: |
          set -euo pipefail

          # JSON, NOT `--format`.
          #
          # `list-tags --format UpdatedAt,Tag --no-header` is accepted and then
          # ignored: doctl prints all four columns WITH the header anyway. The
          # first version of this job took the last field of each line, which is
          # therefore the manifest digest and not the tag — so it would have
          # asked the registry to delete tags named `sha256:…`, pruned nothing,
          # and left the quota exactly where it was while reporting success.
          # `-o json` is unambiguous and cannot drift like a column layout.
          doctl registry repository list-tags app -o json > /tmp/tags.json

          node -e '
            const rows = require("/tmp/tags.json");
            const keepCount = Number(process.env.KEEP);
            const live = (process.env.LIVE || "").trim();
            // A tag with no name is an untagged manifest — the garbage
            // collection reaps those, there is nothing to delete by name.
            const named = rows.filter(r => r.tag)
              .sort((a, b) => b.updated_at.localeCompare(a.updated_at));
            const protect = new Set(["latest"]);
            if (live) protect.add(live);
            const keep = new Set([
              ...protect,
              ...named.filter(r => !protect.has(r.tag)).slice(0, keepCount).map(r => r.tag),
            ]);
            const del = named.filter(r => !keep.has(r.tag)).map(r => r.tag);
            console.error(`keeping: ${[...keep].join(", ")}`);
            if (!live) console.error("::warning::Could not read what production is running, so only the newest tags are protected.");
            process.stdout.write(del.join("\n"));
          ' > /tmp/delete.txt

          # NOTHING DELETED MEANS NOTHING TO COLLECT, so no collection is
          # started. A garbage collection puts the registry in read-only mode
          # for as long as it runs, and starting one that has no unreferenced
          # blobs to free spends that window for nothing.
          if [ ! -s /tmp/delete.txt ]; then
            echo "Nothing to prune, so nothing to collect."
            exit 0
          fi

          echo "Deleting $(wc -l < /tmp/delete.txt) tag(s)."
          while read -r tag; do
            [ -z "${tag}" ] && continue
            doctl registry repository delete-tag app "${tag}" --force || true
          done < /tmp/delete.txt

          # STARTED AND LEFT, never waited on.
          #
          # Deleting a tag frees NOTHING on DigitalOcean until a collection
          # runs, so one is started here — and that is the whole of this step's
          # job. The wait that used to follow was 15 minutes 30 seconds of a
          # 20-minute deploy, every single time, all of it after production was
          # already serving the new image. DigitalOcean will not begin
          # collecting until every write-scoped push token issued before the
          # request has expired, and their TTL is about a quarter of an hour;
          # the collection itself then takes 25 seconds. The loop was watching
          # somebody else's clock.
          #
          # It protected nothing, which is the part worth writing down. The
          # `401 Unauthorized` on push that the wait was written for is
          # prevented by ORDER — this job runs after `build` has pushed, not
          # before it — and that was already true. Sitting here cannot stop the
          # next push landing inside the collection window: a push cancels this
          # run (see `concurrency` at the top) while DigitalOcean's collection
          # carries on regardless. The wait was pure observation of an outcome
          # nothing downstream reads.
          #
          # What is given up is the log line saying whether it succeeded.
          # `doctl registry garbage-collection list` answers that on demand,
          # and a collection that fails is picked back up by the next deploy
          # that deletes a tag — which is exactly where the old `failed` branch
          # pointed anyway.
          if doctl registry garbage-collection start --include-untagged-manifests --force; then
            echo "::notice::Garbage collection started. It runs on DigitalOcean's side and takes about fifteen minutes to begin; nothing here waits for it."
          else
            echo "::notice::A garbage collection was already running; letting it finish."
          fi
