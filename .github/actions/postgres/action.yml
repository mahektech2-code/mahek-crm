# Postgres 16 on 127.0.0.1:5432 for a CI job, as the `services:` block used to
# start it — but a service container is pulled from ONE registry before the
# first step runs, and when public.ecr.aws answers "toomanyrequests: Data limit
# exceeded" the job dies without a line of ours having run. Here each round
# asks the mirror and then Docker Hub, and only backs off when BOTH refuse: a
# refused download is not a fault in the change under test.
#
# BOTH REGISTRIES EVERY ROUND, NOT THE MIRROR FOUR TIMES FIRST. The old order
# waited 10 + 20 + 40 seconds on a mirror that, through October 2026, refused
# every single pull — so every job that needed a database spent 70 to 80
# seconds waiting before Docker Hub served it in two. Seven jobs per PR start a
# database.
#
# AND IT IS A THROWAWAY DATABASE, SO IT DOES NOT WAIT FOR THE DISK. Every
# integration suite truncates dozens of tables before every test, and a
# TRUNCATE gives each table — and everything that cascades from it, out of 310
# — a new file that a durable Postgres fsyncs on commit. `fsync`,
# `synchronous_commit` and `full_page_writes` off, on a data directory in
# memory, is the standard setting for a database whose contents are thrown away
# when the job ends; none of it changes what a query returns.
name: Postgres
description: Start postgres:16 on 127.0.0.1:5432, pulling from the mirror or Docker Hub
runs:
  using: composite
  steps:
    - name: Start Postgres
      shell: bash
      run: |
        img=""
        for wait in 10 20 40 0; do
          for candidate in public.ecr.aws/docker/library/postgres:16 docker.io/library/postgres:16; do
            if docker pull -q "$candidate"; then img="$candidate"; break 2; fi
          done
          [ "$wait" = 0 ] && break
          echo "both registries refused postgres:16; trying again in ${wait}s"; sleep "$wait"
        done
        [ -n "$img" ] || { echo "::error::postgres:16 could not be pulled from any registry"; exit 1; }
        docker run -d --name db -p 5432:5432 \
          --tmpfs /var/lib/postgresql/data:rw \
          -e POSTGRES_USER=mahek -e POSTGRES_PASSWORD=mahek -e POSTGRES_DB=mahekone \
          "$img" \
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        for i in $(seq 1 60); do
          docker exec db pg_isready -h 127.0.0.1 -U mahek -d mahekone >/dev/null 2>&1 && { echo "ready after ${i}s"; exit 0; }
          sleep 1
        done
        docker logs db; echo "::error::Postgres did not become ready"; exit 1
