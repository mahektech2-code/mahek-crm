# Which registry the Dockerfile's node base image is pulled from, for this job.
# The Dockerfile names ECR Public's mirror by default (Docker Hub's anonymous
# limit used to fail jobs on shared runner IPs), and the mirror now answers
# "429 toomanyrequests: Data limit exceeded" instead. A `FROM` cannot fall back
# on its own, so the mirror is asked first, with backoff, and Docker Hub only
# when it keeps refusing; the answer goes to the build as NODE_IMAGE. Only
# both refusing fails the job — a refused download is not a fault in the code.
name: Node base image
description: Pick a registry that will serve node:24-alpine to this runner
outputs:
  image:
    description: The base image reference to build FROM
    value: ${{ steps.pick.outputs.image }}
runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      run: |
        reachable() {
          for wait in 10 20 40 0; do
            docker buildx imagetools inspect "$1" >/dev/null && return 0
            [ "$wait" = 0 ] && return 1
            echo "$1 refused; trying again in ${wait}s"; sleep "$wait"
          done
        }
        for candidate in public.ecr.aws/docker/library/node:24-alpine docker.io/library/node:24-alpine; do
          if reachable "$candidate"; then
            echo "image=$candidate" >> "$GITHUB_OUTPUT"
            echo "Building FROM $candidate"
            exit 0
          fi
          echo "::warning::$candidate could not be reached; trying the next registry"
        done
        echo "::error::node:24-alpine could not be reached on any registry"; exit 1
