# The whole of MahekOne on one droplet: Caddy, the app, and Postgres.
#
# NOT the compose file in the repository root. That one is a bare Postgres for
# local development and is what `npm run db:setup` expects — two files because
# they answer different questions, and collapsing them would mean a developer
# running `docker compose up` in the project root started a production stack
# against an unset .env.
#
# This one is copied to /opt/mahekone/docker-compose.yml on the droplet.
#
# ONLY CADDY IS REACHABLE FROM THE INTERNET. The app and the database publish
# no ports at all — they talk over the private compose network, which is the
# thing that makes this cheap: every query the app makes is a loopback on the
# same machine, so the 36 MB the sheet projection reads costs nothing and takes
# no round trip to another continent.
#
# It also means Postgres is not addressable from outside the box. On Neon it
# was reachable by anybody on the internet holding a password.

name: mahekone

services:
  # ------------------------------------------------------------------ caddy
  # TLS with no certificate to remember. Caddy obtains and renews from Let's
  # Encrypt automatically, which removes the single most commonly forgotten
  # piece of running your own server.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The MBOS APK — see the /downloads handle_path block in Caddyfile.
      # A plain file on the droplet's disk, replaced by hand on each release;
      # never part of the app image, so a 90+ MB binary never touches the
      # 500 MB container registry.
      - ./downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # The customer-facing host (Caddyfile). Unset: Caddy uses track.mahekindia.com.
      PUBLIC_LINK_HOST: ${PUBLIC_LINK_HOST:-track.mahekindia.com}
      # Which app processes Caddy sends requests to. One unless .env says
      # otherwise; with COMPOSE_PROFILES=scale it is "app:3000 app2:3000".
      APP_UPSTREAMS: ${APP_UPSTREAMS:-app:3000}
    depends_on:
      - app
    networks: [mahek]

  # -------------------------------------------------------------------- app
  # NODE RUNS ON ONE CORE, WHATEVER THE BOX HAS. Every page is rendered on the
  # server, and a Node process renders one thing at a time: while it spends
  # 300 ms of CPU drawing one person's customer list, everybody else's request
  # waits behind it. Measured on a book of demo data, one core, one process: one
  # dashboard alone took 0.25 s, ten people opening it at once took 1.4 s each,
  # twenty took 2.3 s. That queue is what "the pages are slow" is.
  #
  # So there can be TWO of these, `app` and `app2` (below), and Caddy sends each
  # request to whichever is less busy. It only helps with a second CPU to run
  # it on — on 1 vCPU the two would take turns on the same core — which is why
  # `app2` is off until `.env` says `COMPOSE_PROFILES=scale` (DEPLOY.md, "When to
  # resize again"). It is the same image and the same settings, so nothing
  # behaves differently on one than the other: sessions are rows, caches are
  # rebuildable per process, and the two live streams hear new events through
  # Postgres LISTEN/NOTIFY, not through memory one process holds.
  app: &app
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    environment:
      # localhost in every sense that matters — same machine, private network.
      DATABASE_URL: postgres://mahek:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/mahekone
      NODE_ENV: production
      # Cap the heap so a runaway render cannot take the database down with
      # it. Node's default ceiling assumes it owns the machine. It was 320 on
      # the 1 GiB box, and on 16 Nov 2026 the heap filled every 30-60 minutes
      # under the day's load and the process died — every screen loading at
      # that moment showed "This screen could not be drawn". 704 on 2 GiB
      # leaves Postgres, the website (256M hard limit), Caddy and the OS their
      # share. On 4 GiB with two processes, APP_HEAP_MB=768 in .env gives each
      # one 768 MB and still leaves Postgres a gigabyte.
      NODE_OPTIONS: --max-old-space-size=${APP_HEAP_MB:-704}
      # Connections per process. Two processes × this must stay under
      # PG_MAX_CONNECTIONS with room for psql and the nightly job.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mahek]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # The second renderer. Identical to `app` (the YAML anchor copies every key),
  # started only when COMPOSE_PROFILES=scale is in .env. Caddy is told to use it
  # by APP_UPSTREAMS in the same file — see the Caddyfile. `restart.sh` replaces
  # the two one at a time, so with both running a deploy no longer drops the
  # requests that arrive during the swap.
  app2:
    <<: *app
    profiles: [scale]

  # --------------------------------------------------------------- postgres
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mahek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mahekone
      # The working day is Asia/Kolkata and several rules depend on the session
      # zone NOT being a surprise. Neon ran in GMT, which is exactly how a 1am
      # IST call landed on the previous day; local Postgres runs in whatever it
      # is told, so it is told.
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    # 127.0.0.1 IS THE WHOLE OF THIS LINE'S MEANING.
    #
    # Bound to the droplet's loopback and nowhere else: not 0.0.0.0, not the
    # public interface, not the private network. Nothing off this machine can
    # reach it, which is the same guarantee publishing no port at all gave —
    # and the firewall does not even come into it, because loopback traffic
    # never touches a filter.
    #
    # It has to be published at all because of migrations. `deploy.yml` opens
    # `ssh -L 5433:127.0.0.1:5432` and runs drizzle-kit through it, and an SSH
    # tunnel lands on the HOST's loopback — where, with no `ports:` here, there
    # was nothing listening. The tunnel came up, ExitOnForwardFailure was
    # satisfied because the forward itself succeeded, and every connection then
    # died with ECONNRESET against a closed port. The database was fine
    # throughout; there was simply no route to it.
    #
    # Reaching it still requires the deploy private key. Publishing on
    # 0.0.0.0 would be the mistake — that would put Postgres back on the
    # internet, which is exactly what leaving Neon was meant to end.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # A named volume on the droplet's SSD. Rebuilding or rolling back the app
      # container does not touch it.
      - pgdata:/var/lib/postgresql/data
    # TUNED FOR 2 GiB (it was 1 GiB until 16 Nov 2026), and these numbers are not defaults being restated.
    # Postgres ships assuming a far bigger machine; left alone it would reserve
    # more than this box has and the OOM killer would arrive during the nightly
    # recompute. The whole database is ~420 MB, so effective_cache_size is the
    # honest guess at what the OS will hold, not a reservation.
    command:
      - postgres
      - -c
      # On 4 GiB: PG_SHARED_BUFFERS=1GB and PG_EFFECTIVE_CACHE=2GB in .env. The
      # database is far smaller than that, so the whole of it then lives in
      # memory and no screen ever waits on the disk.
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-640MB}    # honest: the app holds a 704MB heap beside this
      - -c
      - work_mem=8MB                  # was 4MB; 1,901 sorts spilled 9.4GB to disk
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-20}   # was 30; the app pool is 10, and this pays for work_mem. Two processes: 30
      - -c
      # MIGRATING AN EMPTY DATABASE NEEDS MORE LOCKS THAN THE DEFAULT. The lock
      # table holds max_locks_per_transaction × max_connections, and with 20
      # connections the default of 64 left too few: drizzle applies every
      # pending migration in ONE transaction, and from nothing that is 330+
      # migrations creating well over a thousand relations, each locked until
      # commit. It ran out ("out of shared memory", 53200) the day the Locker's
      # tables were added — on a fresh droplet, a rebuild and the CI stack
      # test. A deployed database applies only what is pending and never comes
      # close. 512 costs a few MB of shared memory.
      - max_locks_per_transaction=512
      - -c
      - random_page_cost=1.1          # NVMe, not a spinning disk
      - -c
      - effective_io_concurrency=200  # NVMe; was the single-spindle default of 1
      - -c
      # MEASURED ON THIS BOX, same query and same data: 198.9ms with JIT off,
      # 866.2ms with it forced on, compiling 40 functions. The planner reaches
      # the threshold because a dozen correlated subqueries inflate the
      # ESTIMATED cost, not because there is real work to amortise a compile
      # against — and on one vCPU there is no spare core to compile on.
      - jit=off
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - track_io_timing=on            # lets EXPLAIN separate CPU from I/O
      - -c
      # Without this there is no per-statement attribution in production at
      # all, which is why a 219ms queue scan and a 164ms triple-DISTINCT went
      # unmeasured for so long. Needs `CREATE EXTENSION pg_stat_statements`
      # once, after the restart that preloads it.
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=2000
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=500   # 2000 hid a 219ms queue scan and a 164ms triple-DISTINCT
    networks: [mahek]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahek -d mahekone"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  mahek:
    driver: bridge
